packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^26.5.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
allowBuilds:
  esbuild: true
  lightningcss: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # Match the oxlint and oxfmt that vite-plus bundles, so ultracite's presets
  # type-check against the same rule schemas that run.
  oxfmt: 0.66.0
  oxlint: 1.81.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/react-start-rsc@0.1.53"
  - "@tanstack/react-start@1.168.54"
  - "@tanstack/start-plugin-core@1.171.44"
