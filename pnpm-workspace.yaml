packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^26.5.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
  "@fontsource-variable/inter": ^5.3.0
  "@radix-ui/colors": ^3.0.0
  "@stylexjs/stylex": ^0.19.0
  "@stylexjs/unplugin": ^0.19.0
  "@microsoft/tsdoc": ^0.16.0
  oxc-parser: ^0.150.0
  "@vitest/coverage-v8": 4.1.11
allowBuilds:
  esbuild: true
  lightningcss: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/react-start-rsc@0.1.53"
  - "@tanstack/react-start@1.168.54"
  - "@tanstack/start-plugin-core@1.171.44"
