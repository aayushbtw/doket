name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: true
      - run: vp check
      - run: vp pack

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.17.0 is the lowest Node the package supports.
        node: [22.17.0, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true
      - run: vp test run
