name: CI

on:
  push:
    branches: [main]
    paths-ignore: [apps/**]
  pull_request:
    paths-ignore: [apps/**]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: true
      - run: vp check packages
      - run: vp run --filter tomekit build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true
      - run: vp run --filter tomekit test
