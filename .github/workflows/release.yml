name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm Trusted Publishing exchanges this token for a short-lived publish token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # setup-vp installs pnpm and caches it; setup-node would look for pnpm before it exists.
          package-manager-cache: false
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-manager: false
          cache: true
          run-install: true
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      # prepublishOnly runs vp check, vp test and vp pack first.
      - run: npm publish
